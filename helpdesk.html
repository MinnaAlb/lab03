<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="CWA Help Desk Appointment">
    <meta name="keywords" content="CWA, Help Desk, Appointment">
    <meta name="author" content="Your Name">
    <title>CWA Help Desk Appointment</title>
</head>

<body>

    <a href="https://www.swin.edu.au">
        <img src="images/logo.png" alt="Swinburne University of Technology logo">
    </a>

    <h1>CWA Help Desk Appointment</h1>

    <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>

    <p>Check Blackboard for when CWA tutors will be there.</p>

    <form action="#" method="post">

        <fieldset>
            <legend>Student details</legend>

            <label for="studentid">Student ID</label>
            <input type="text"
                   id="studentid"
                   name="studentid"
                   pattern="\d{7,10}"
                   required>

            <br><br>

            <label for="givenname">Given Name</label>
            <input type="text"
                   id="givenname"
                   name="givenname"
                   maxlength="15"
                   pattern="[A-Za-z]+"
                   required>

            <label for="familyname">Family Name</label>
            <input type="text"
                   id="familyname"
                   name="familyname"
                   maxlength="15"
                   pattern="[A-Za-z]+"
                   required>

        </fieldset>

        <fieldset>
            <legend>Your unit</legend>

            <input type="radio"
                   id="cos10011"
                   name="unit"
                   value="COS10011"
                   required>
            <label for="cos10011">COS10011</label>

            <input type="radio"
                   id="cos60004"
                   name="unit"
                   value="COS60004">
            <label for="cos60004">COS60004</label>

            <input type="radio"
                   id="cos60007"
                   name="unit"
                   value="COS60007">
            <label for="cos60007">COS60007</label>

            <br><br>

            <label for="tutor">Your Tutor</label>

            <select id="tutor" name="tutor" required>
                <option value="">Please Select</option>
                <option value="Hamada">Dr Hamada</option>
                <option value="Amani">Dr Amani</option>
                <option value="Johnson">Dr Johnson</option>
                <option value="Omar">Dr Omar</option>
            </select>

        </fieldset>

        <fieldset>
            <legend>Issue</legend>

            <input type="checkbox"
                   id="html"
                   name="issue[]"
                   value="HTML"
                   checked="checked">
            <label for="html">HTML</label>

            <input type="checkbox"
                   id="css"
                   name="issue[]"
                   value="CSS">
            <label for="css">CSS</label>

            <input type="checkbox"
                   id="javascript"
                   name="issue[]"
                   value="JavaScript">
            <label for="javascript">JavaScript</label>

            <input type="checkbox"
                   id="php"
                   name="issue[]"
                   value="PHP">
            <label for="php">PHP</label>

            <input type="checkbox"
                   id="mysql"
                   name="issue[]"
                   value="MySQL">
            <label for="mysql">MySQL</label>

            <br><br>

            <label for="description">Description of Issue</label><br>

            <textarea id="description"
                      name="description"
                      rows="5"
                      cols="30"
                      placeholder="Write description of your problem here..."></textarea>

        </fieldset>

        <fieldset>
            <legend>Preferred Date / Time</legend>

            <label for="date">Date</label>
            <input type="text"
                   id="date"
                   name="date"
                   placeholder="dd/mm/yyyy"
                   pattern="(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[012])/[0-9]{4}"
                   required>

            <br>

            <label for="time">Time</label>
            <input type="text"
                   id="time"
                   name="time"
                   placeholder="hh:mm"
                   pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]"
                   required>

        </fieldset>

        <input type="submit" value="Book">
        <input type="reset" value="Reset form">

    </form>

</body>
</html>
